app = "enterprise-agent-frontend"
primary_region = "iad"

[build]
  dockerfile = "frontend/Dockerfile"

[env]
  BACKEND_URL = "https://enterprise-agent-backend.fly.dev"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
