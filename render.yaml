services:
  - type: web
    name: enterprise-agent-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: CORS_ALLOWED_ORIGINS
        value: https://enterprise-agent-frontend.onrender.com

  - type: web
    name: enterprise-agent-frontend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: BACKEND_URL
        value: https://enterprise-agent-backend.onrender.com
