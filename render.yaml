services:
  - type: web
    name: cogniflow-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: TAVILY_MAX_RESULTS
        value: "5"
      - key: TAVILY_SEARCH_DEPTH
        value: advanced
      - key: TAVILY_TIMEOUT_SECONDS
        value: "15"
      - key: CORS_ALLOWED_ORIGINS
        value: https://enterprise-agentic-rag-l1vv-ggzgdp255-soft-37b4.vercel.app,https://cogniflow-backend.onrender.com
